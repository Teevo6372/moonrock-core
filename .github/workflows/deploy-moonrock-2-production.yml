name: Deploy Moonrock 2 Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY-MOONROCK-2-PRODUCTION to deploy the standalone frontend to Cloudflare Pages production
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: moonrock-2-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/moonrock-2-frontend
    env:
      VITE_NOVA_API_BASE_URL: ${{ vars.NOVA_RAILWAY_ORIGIN || 'https://moonrock-core-production.up.railway.app' }}
      MOONROCK_PUBLIC_ORIGIN: ${{ vars.MOONROCK_2_PUBLIC_ORIGIN || 'https://moonrock-2.pages.dev' }}
      MOONROCK_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'moonrock-2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production confirmation and configuration
        env:
          PAGES_PROJECT: ${{ env.MOONROCK_PAGES_PROJECT }}
          NOVA_ORIGIN: ${{ env.VITE_NOVA_API_BASE_URL }}
          PUBLIC_ORIGIN: ${{ env.MOONROCK_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_production }}" != "DEPLOY-MOONROCK-2-PRODUCTION" ]]; then
            echo "Production confirmation did not match." >&2
            exit 1
          fi
          test -n "$PAGES_PROJECT"
          test -n "$NOVA_ORIGIN"
          test -n "$PUBLIC_ORIGIN"
          for origin in "$NOVA_ORIGIN" "$PUBLIC_ORIGIN"; do
            case "$origin" in
              https://*) ;;
              *) echo "Configured origins must use https." >&2; exit 1 ;;
            esac
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build Moonrock 2 frontend
        run: npm run build

      - name: Deploy Cloudflare Pages production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/moonrock-2-frontend
          command: pages deploy dist --project-name=${{ env.MOONROCK_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test deployed frontend and Nova runtime
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          FALLBACK_URL: ${{ steps.deploy.outputs.deployment-url }}
          NOVA_ORIGIN: ${{ env.VITE_NOVA_API_BASE_URL }}
          PUBLIC_ORIGIN: ${{ env.MOONROCK_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          FRONTEND_URL="${DEPLOYMENT_URL:-$FALLBACK_URL}"
          test -n "$FRONTEND_URL"

          frontend_body="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$FRONTEND_URL/")"
          if ! printf '%s' "$frontend_body" | grep -q '<title>Moonrock 2.0</title>'; then
            echo "Smoke failure: deployed frontend did not contain the expected Moonrock 2.0 title." >&2
            exit 1
          fi

          headers="$(mktemp)"
          runtime_body="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 \
            -D "$headers" \
            -H "Origin: $PUBLIC_ORIGIN" \
            "$NOVA_ORIGIN/health/live")"
          echo "Railway health response: $runtime_body"
          cors_origin="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          echo "Railway CORS allow-origin: ${cors_origin:-<missing>}"

          if ! printf '%s' "$runtime_body" | grep -q '"status":"live"'; then
            echo "Smoke failure: Railway health response did not report status=live." >&2
            exit 1
          fi
          if [[ "$cors_origin" != "$PUBLIC_ORIGIN" ]]; then
            echo "Smoke failure: Railway did not authorize expected origin $PUBLIC_ORIGIN." >&2
            exit 1
          fi

          echo "Smoke validation passed: frontend loaded and Railway accepted $PUBLIC_ORIGIN."

      - name: Report production deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          FALLBACK_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Moonrock 2 production deployment URL: ${DEPLOYMENT_URL:-$FALLBACK_URL}"
